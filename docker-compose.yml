services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lanting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/lanting}
      API_PORT: ${API_PORT:-3001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "3001:3001"

  collector:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/lanting}
      API_PORT: ${API_PORT:-3001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      COLLECTOR_POLL_INTERVAL_MS: ${COLLECTOR_POLL_INTERVAL_MS:-4000}
      COLLECTOR_GLOBAL_CONCURRENCY: ${COLLECTOR_GLOBAL_CONCURRENCY:-3}
    command: ["pnpm", "--filter", "@lan-ting/api", "worker"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
      WEB_PORT: ${WEB_PORT:-5173}
    ports:
      - "5173:5173"

volumes:
  postgres-data:
